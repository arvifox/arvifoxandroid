plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-kapt'
    id 'org.jetbrains.kotlin.plugin.compose'
}

kotlin {
    jvmToolchain(21)
}

android {
    compileSdk 35

    defaultConfig {
        applicationId "com.arvifox.fulltestcompose"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    buildFeatures {
        compose true
    }
    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
    namespace 'com.arvifox.fulltestcompose'
}

dependencies {

    implementation 'com.github.Muratthekus:Compose-CurrencyText:1.0.1'

    implementation 'androidx.core:core-ktx:1.16.0'
    implementation "androidx.lifecycle:lifecycle-process:2.8.7"
    //implementation "androidx.lifecycle:lifecycle-compiler:2.6.1"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.7"
    implementation "androidx.lifecycle:lifecycle-livedata-ktx:2.8.7"
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.7'

    implementation "androidx.biometric:biometric:1.1.0"
    implementation "com.google.android.material:material:1.12.0"
    implementation "androidx.activity:activity-ktx:1.10.1"
    implementation "androidx.fragment:fragment-ktx:1.8.6"
    implementation "androidx.work:work-runtime-ktx:2.10.1"
    implementation "com.jakewharton.timber:timber:5.0.1"
    implementation "com.caverock:androidsvg-aar:1.4"
    implementation "androidx.hilt:hilt-navigation-compose:1.2.0"
    implementation "androidx.hilt:hilt-work:1.2.0"
    kapt "androidx.hilt:hilt-compiler:1.2.0"

    implementation "androidx.room:room-runtime:2.7.1"

    implementation "androidx.compose.ui:ui:1.8.0"
    implementation 'androidx.compose.runtime:runtime-livedata:1.8.0'
    //implementation 'androidx.compose.compiler:compiler:1.4.0'
    implementation 'androidx.compose.foundation:foundation:1.8.0'
    implementation 'androidx.compose.runtime:runtime:1.8.0'
    implementation "androidx.compose.material3:material3:1.3.2"
    implementation "com.google.accompanist:accompanist-themeadapter-material:0.30.1"
    implementation "com.google.accompanist:accompanist-navigation-animation:0.30.1"
    implementation "androidx.compose.animation:animation:1.8.0"
    implementation "androidx.compose.animation:animation-graphics:1.8.0"
    implementation "androidx.compose.animation:animation-core:1.8.0"
    implementation "androidx.compose.animation:animation-android:1.8.0"
    implementation "androidx.compose.ui:ui-tooling-preview:1.8.0"
    implementation 'androidx.activity:activity-compose:1.10.1'
    implementation 'androidx.constraintlayout:constraintlayout-compose:1.1.1'
    implementation 'com.google.accompanist:accompanist-navigation-animation:0.30.1'
    implementation 'androidx.core:core-ktx:1.16.0'
    debugImplementation "androidx.compose.ui:ui-tooling:1.8.0"

    testImplementation 'junit:junit:4.13.2'
    testImplementation "org.mockito:mockito-inline:5.2.0"
    testImplementation "org.mockito.kotlin:mockito-kotlin:5.2.1"
    testImplementation "io.mockk:mockk:1.13.8"
    testImplementation "com.google.truth:truth:1.4.2"
    testImplementation "androidx.test.ext:junit:1.2.1"
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
    androidTestImplementation "androidx.compose.ui:ui-test-junit4:1.8.0"

    implementation 'io.coil-kt:coil:2.7.0'
    implementation 'io.coil-kt:coil-svg:2.7.0'
    implementation 'io.coil-kt:coil-compose:2.7.0'
}